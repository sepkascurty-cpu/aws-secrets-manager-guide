<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#444444"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#B00020"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1280" height="1040" fill="#ffffff"/>

  <!-- AWS Cloud outer -->
  <rect x="16" y="16" width="1248" height="1008" rx="8" fill="none" stroke="#333333" stroke-width="2"/>
  <rect x="28" y="28" width="64" height="40" fill="#232F3E"/>
  <text x="60" y="54" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">aws</text>
  <text x="102" y="54" fill="#232F3E" font-size="18" font-weight="bold">AWS Cloud</text>

  <!-- Legend -->
  <g font-size="11">
    <text x="1040" y="60" fill="#232F3E" font-size="12" font-weight="bold">Legend</text>
    <rect x="1040" y="68" width="14" height="14" fill="#FF9900"/><text x="1060" y="80" fill="#333">Compute (ECS / Lambda)</text>
    <rect x="1040" y="88" width="14" height="14" fill="#3B48CC"/><text x="1060" y="100" fill="#333">Database (RDS)</text>
    <rect x="1040" y="108" width="14" height="14" fill="#DD344C"/><text x="1060" y="120" fill="#333">Security (Secrets Manager)</text>
    <rect x="1040" y="128" width="14" height="14" fill="#2E86C1"/><text x="1060" y="140" fill="#333">Encryption (KMS)</text>
    <rect x="1040" y="148" width="14" height="10" fill="none" stroke="#2E86C1" stroke-width="1.5" stroke-dasharray="5,3"/><text x="1060" y="157" fill="#333">Availability Zone</text>
  </g>

  <!-- Primary region -->
  <rect x="28" y="84" width="860" height="940" fill="none" stroke="#7AA800" stroke-width="2" stroke-dasharray="10,6"/>
  <text x="44" y="108" fill="#5A7A00" font-size="14" font-weight="bold">AWS Region — ap-southeast-1 (primary)</text>

  <!-- AZ-a -->
  <rect x="48" y="120" width="390" height="640" fill="none" stroke="#2E86C1" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="64" y="144" fill="#2E86C1" font-size="13" font-weight="bold">AZ-a</text>

  <!-- AZ-b -->
  <rect x="458" y="120" width="390" height="640" fill="none" stroke="#2E86C1" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="474" y="144" fill="#2E86C1" font-size="13" font-weight="bold">AZ-b</text>

  <!-- ============ APP TIER (private subnets) ============ -->
  <!-- AZ-a app subnet -->
  <rect x="68" y="160" width="350" height="150" fill="#EAF7E4" stroke="#7AA800" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="82" y="182" fill="#5A7A00" font-size="12" font-weight="bold">Private subnet — app (10.0.11.0/24)</text>
  <rect x="110" y="195" width="90" height="80" rx="8" fill="#FF9900"/>
  <text x="155" y="228" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">ECS</text>
  <text x="155" y="246" text-anchor="middle" fill="#ffffff" font-size="11">task</text>
  <text x="155" y="300" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="bold">App container</text>
  <text x="155" y="316" text-anchor="middle" fill="#555555" font-size="11" font-style="italic">reads secret at runtime</text>

  <rect x="260" y="195" width="90" height="80" rx="8" fill="#FF9900"/>
  <text x="305" y="228" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Lambda</text>
  <text x="305" y="246" text-anchor="middle" fill="#ffffff" font-size="11">worker</text>
  <text x="305" y="300" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="bold">Serverless job</text>
  <text x="305" y="316" text-anchor="middle" fill="#555555" font-size="11" font-style="italic">no creds in env vars</text>

  <!-- AZ-b app subnet -->
  <rect x="478" y="160" width="350" height="150" fill="#EAF7E4" stroke="#7AA800" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="492" y="182" fill="#5A7A00" font-size="12" font-weight="bold">Private subnet — app (10.0.21.0/24)</text>
  <rect x="520" y="195" width="90" height="80" rx="8" fill="#FF9900"/>
  <text x="565" y="228" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">ECS</text>
  <text x="565" y="246" text-anchor="middle" fill="#ffffff" font-size="11">task</text>
  <text x="565" y="300" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="bold">App container</text>
  <text x="565" y="316" text-anchor="middle" fill="#555555" font-size="11" font-style="italic">cached in memory only</text>

  <!-- ============ DB TIER (private subnets) ============ -->
  <!-- AZ-a db subnet -->
  <rect x="68" y="360" width="350" height="170" fill="#E8ECFA" stroke="#3B48CC" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="82" y="382" fill="#3B48CC" font-size="12" font-weight="bold">Private subnet — db (10.0.12.0/24)</text>
  <rect x="110" y="395" width="100" height="80" rx="8" fill="#3B48CC"/>
  <text x="160" y="428" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">RDS</text>
  <text x="160" y="446" text-anchor="middle" fill="#ffffff" font-size="11">MySQL</text>
  <text x="285" y="425" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="bold">Primary</text>
  <text x="285" y="441" text-anchor="middle" fill="#555555" font-size="11" font-style="italic">password lives in</text>
  <text x="285" y="457" text-anchor="middle" fill="#555555" font-size="11" font-style="italic">Secrets Manager only</text>

  <!-- AZ-b db subnet -->
  <rect x="478" y="360" width="350" height="170" fill="#E8ECFA" stroke="#3B48CC" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="492" y="382" fill="#3B48CC" font-size="12" font-weight="bold">Private subnet — db (10.0.22.0/24)</text>
  <rect x="520" y="395" width="100" height="80" rx="8" fill="#3B48CC"/>
  <text x="570" y="428" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">RDS</text>
  <text x="570" y="446" text-anchor="middle" fill="#ffffff" font-size="11">standby</text>
  <text x="695" y="425" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="bold">Multi-AZ</text>
  <text x="695" y="441" text-anchor="middle" fill="#555555" font-size="11" font-style="italic">same credential,</text>
  <text x="695" y="457" text-anchor="middle" fill="#555555" font-size="11" font-style="italic">one rotation</text>

  <!-- ============ SECRETS MANAGER (shared) ============ -->
  <rect x="48" y="560" width="800" height="200" fill="#FDECEE" stroke="#DD344C" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="64" y="584" fill="#DD344C" font-size="13" font-weight="bold">Shared services — secrets control plane</text>

  <rect x="100" y="600" width="150" height="110" rx="10" fill="#DD344C"/>
  <text x="175" y="640" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Secrets</text>
  <text x="175" y="660" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Manager</text>
  <text x="175" y="690" text-anchor="middle" fill="#ffffff" font-size="11">db-credentials</text>
  <text x="175" y="730" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="bold">Secret store</text>
  <text x="175" y="746" text-anchor="middle" fill="#555555" font-size="11" font-style="italic">versions: AWSCURRENT / AWSPENDING</text>

  <rect x="330" y="600" width="150" height="110" rx="10" fill="#2E86C1"/>
  <text x="405" y="640" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">KMS</text>
  <text x="405" y="660" text-anchor="middle" fill="#ffffff" font-size="11">customer CMK</text>
  <text x="405" y="690" text-anchor="middle" fill="#ffffff" font-size="11">alias/db-secrets</text>
  <text x="405" y="730" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="bold">Encryption key</text>
  <text x="405" y="746" text-anchor="middle" fill="#555555" font-size="11" font-style="italic">envelope encryption</text>

  <rect x="560" y="600" width="150" height="110" rx="10" fill="#FF9900"/>
  <text x="635" y="640" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Rotation</text>
  <text x="635" y="660" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Lambda</text>
  <text x="635" y="690" text-anchor="middle" fill="#ffffff" font-size="11">every 30 days</text>
  <text x="635" y="730" text-anchor="middle" fill="#232F3E" font-size="12" font-weight="bold">Rotation function</text>
  <text x="635" y="746" text-anchor="middle" fill="#555555" font-size="11" font-style="italic">create → set → test → finish</text>

  <!-- ============ Labeled traffic arrows ============ -->
  <!-- 1. App -> Secrets Manager: GetSecretValue -->
  <line x1="155" y1="310" x2="155" y2="600" stroke="#444444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="163" y="470" fill="#232F3E" font-size="12" font-weight="bold">1. GetSecretValue</text>
  <text x="163" y="486" fill="#555555" font-size="11">at runtime (IAM role)</text>

  <!-- 2. Secrets Manager -> KMS: decrypt -->
  <line x1="250" y1="655" x2="330" y2="655" stroke="#444444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="252" y="640" fill="#232F3E" font-size="12" font-weight="bold">2. kms:Decrypt</text>

  <!-- 3. Rotation Lambda -> Secrets Manager -->
  <line x1="560" y1="640" x2="270" y2="620" stroke="#B00020" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="560" y="600" fill="#B00020" font-size="12" font-weight="bold">3. rotate on schedule</text>

  <!-- 4. Rotation Lambda -> RDS: set new password -->
  <line x1="635" y1="600" x2="330" y2="445" stroke="#B00020" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="470" y="520" fill="#B00020" font-size="12" font-weight="bold">4. new password → RDS</text>
  <text x="470" y="536" fill="#555555" font-size="11">(test, then AWSPENDING → AWSCURRENT)</text>

  <!-- 5. App -> RDS: connect with secret -->
  <line x1="200" y1="310" x2="200" y2="395" stroke="#444444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="208" y="360" fill="#232F3E" font-size="12" font-weight="bold">5. connect (no stored password)</text>

  <!-- ============ Partner account (cross-account read) ============ -->
  <rect x="48" y="800" width="390" height="140" fill="none" stroke="#7AA800" stroke-width="2" stroke-dasharray="10,6"/>
  <text x="64" y="824" fill="#5A7A00" font-size="13" font-weight="bold">Partner AWS account (cross-account)</text>
  <rect x="90" y="840" width="90" height="70" rx="8" fill="#FF9900"/>
  <text x="135" y="868" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">Lambda</text>
  <text x="135" y="886" text-anchor="middle" fill="#ffffff" font-size="10">analytics</text>
  <line x1="180" y1="875" x2="100" y2="710" stroke="#444444" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="200" y="790" fill="#232F3E" font-size="12" font-weight="bold">6. read via resource policy</text>

  <!-- ============ DR region (replication) ============ -->
  <rect x="458" y="800" width="390" height="140" fill="none" stroke="#7AA800" stroke-width="2" stroke-dasharray="10,6"/>
  <text x="474" y="824" fill="#5A7A00" font-size="13" font-weight="bold">DR region — ap-southeast-3</text>
  <rect x="510" y="840" width="130" height="70" rx="10" fill="#DD344C"/>
  <text x="575" y="868" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">Replica secret</text>
  <text x="575" y="886" text-anchor="middle" fill="#ffffff" font-size="10">own KMS key</text>
  <line x1="250" y1="710" x2="510" y2="875" stroke="#444444" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="290" y="920" fill="#232F3E" font-size="12" font-weight="bold">7. replicate (encrypted)</text>

  <!-- ============ CloudTrail audit strip ============ -->
  <rect x="908" y="84" width="336" height="940" fill="#FFF8E6" stroke="#FF9900" stroke-width="1.5"/>
  <text x="924" y="108" fill="#B26A00" font-size="13" font-weight="bold">Audit &amp; governance</text>
  <rect x="930" y="120" width="120" height="60" rx="8" fill="#FF9900"/>
  <text x="990" y="144" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">CloudTrail</text>
  <text x="990" y="162" text-anchor="middle" fill="#ffffff" font-size="10">logs</text>
  <text x="924" y="205" fill="#232F3E" font-size="12">• Every GetSecretValue logged</text>
  <text x="924" y="225" fill="#232F3E" font-size="12">• Alert on unusual principals</text>
  <text x="924" y="245" fill="#232F3E" font-size="12">• Rotation history per version</text>
  <text x="924" y="265" fill="#232F3E" font-size="12">• Break-glass reads reviewed</text>
  <rect x="930" y="290" width="120" height="60" rx="8" fill="#2E86C1"/>
  <text x="990" y="314" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">IAM</text>
  <text x="990" y="332" text-anchor="middle" fill="#ffffff" font-size="10">policies</text>
  <text x="924" y="375" fill="#232F3E" font-size="12">• Per-secret GetSecretValue</text>
  <text x="924" y="395" fill="#232F3E" font-size="12">• kms:Decrypt on the CMK</text>
  <text x="924" y="415" fill="#232F3E" font-size="12">• No secretsmanager:* on *</text>
  <rect x="930" y="440" width="120" height="60" rx="8" fill="#DD344C"/>
  <text x="990" y="464" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">Resource</text>
  <text x="990" y="482" text-anchor="middle" fill="#ffffff" font-size="10">policy</text>
  <text x="924" y="525" fill="#232F3E" font-size="12">• Cross-account allow-list</text>
  <text x="924" y="545" fill="#232F3E" font-size="12">• Deny without MFA (optional)</text>

  <!-- title strip -->
  <text x="640" y="1000" text-anchor="middle" fill="#232F3E" font-size="16" font-weight="bold">AWS Secrets Manager — runtime reads, KMS envelope encryption, automatic rotation, cross-account &amp; cross-region</text>
</svg>
